<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SharpgearAPP - Tailwind + DaisyUI + Vite</title>
  <script type="module" src="/src/main.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-black font-poppins overflow-x-hidden flex flex-col items-start min-h-screen">
  <div class="navbar bg-black h-24 text-white flex justify-between items-center px-6">
    <a class="btn btn-ghost">
      <img class="h-14 -mt-1" src="src/sharpgear-files/Sharpgear Branding/Gearpunk.png">
    </a>

    <span class="flex-1">
      <a href="" class="link link-hover btn text-xl btn-ghost">
        Sobre
      </a>
      <a href="./loja.html" class="link link-hover btn text-xl btn-ghost ">
        Loja
      </a>
      <a href="./projetos.html" class="link link-hover btn text-xl btn-ghost ">
        Projetos
      </a>
      <a class="link link-hover btn text-xl  btn-ghost">
        Comunidade
      </a>
      <a class="link link-hover  btn text-xl btn-ghost">
        Membros
      </a>
      <a class="link link-hover btn text-xl btn-ghost">
        Biblioteca
      </a>
    </span>
  </div>  

  <section class="text-white items-center w-screen bg-gray-800 flex h-[70vh] justify-center">
    <form class="bg-gray-950 flex flex-col h-[80%] w-[20%] rounded-lg shadow-lg shadow-neutral-950" method="POST">
      <label class="pt-5 self-center place-self-center cursor-pointer">
        <img 
          class="lg:h-[200px] lg:w-[200px] md:w-[100px] md:h-[100px]" 
          src="./src/images/PLACEHOLDER.webp"
          alt="Escolher imagem"
        >
        <input 
          type="file" 
          class="hidden" 
          name="imagem" 
          accept="image/*"
        >
      </label>

      <script>
        const input = document.querySelector('input[type="file"]');
        const img = document.querySelector('label img');
      
        input.addEventListener('change', (event) => {
          const file = event.target.files[0];
          if (file) {
            img.src = URL.createObjectURL(file);
          }
        });
      </script>
      

        <article class="justify-center items-center py-5 text-2xl text-wrap flex flex-col">
            <textarea id="username" class="bg-gray-900 outline-2 outline-white outline text-center text-white placeholder-gray-500 rounded-md h-[50%] w-[73%] resize-none overflow-hidden"  maxlength="16">Placeholder
            </textarea>
          </article>

        <section class="justify-center items-center flex flex-col row-start-4 row-span-2 bg-gray-900 rounded-b-md  w-full h-full">
          <div class=" w-[92%] h-[82%] text-wrap text-center lg:text-xl md:text-xs flex flex-col items-center justify-center">
            <textarea id="description" class="bg-gray-900 outline-2 outline-white outline text-center text-white placeholder-gray-500 rounded-md w-[90%] h-[90%]" maxlength="207" placeholder="Escreva qualquer coisa aqui! Sua própria descrição!"></textarea>
          </div>
        </section>
      
        <button type="submit" class="bg-green-600 py-2 shadow-lg rounded-b-xl shadow-green-900">Salvar Alterações</button>
      </form>


  </section>

  <footer class="footer footer-horizontal footer-center text-base-content rounded bg-black">
    <div>
      <img class="h-[20vh]" src="src\sharpgear-files\Sharpgear Branding\Sharpgear Horizontal Logo.png">
    </div>

    <nav class="grid text-xl font-semibold grid-flow-col gap-4  text-white">
      <a class="link link-hover">Sobre</a>
      <p>|</p>
      <a href="./loja.html" class="link link-hover">Loja</a>
      <p>|</p>
      <a href="./projetos.html" class="link link-hover">Projetos</a>
      <p>|</p>
      <a class="link link-hover">Comunidade</a>
    </nav>
    <nav>
      <div class="grid grid-flow-col gap-4">
      </div>
    </nav>
    <aside>
      <p class="text-gray-600">
        2025 Sharpgear Studios • Todos os Direitos Reservados | Design por Adrian Barbosa</p>
    </aside>
  </footer>

</body>
</html>
